<!DOCTYPE html>
<html lang="en">
<head>
    <title>Practica Loop While 1</title>
</head>
<body>
    <script>
        function contarvueltas(vueltas){
            let contador = 1;
            vueltas = parseInt(vueltas);

            while (contador <= vueltas) {
                console.log("Vuelta numero: " + contador);
                contador++;
            }
        }

        let vueltasUser = prompt("Ingrese cantidad de vueltas");
        contarvueltas(vueltasUser)
    </script>
</body>
</html>
