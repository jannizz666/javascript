<!DOCTYPE html>
<html lang="en">
<head>
    <title>Index</title>
</head>
<body>
    <script>
        let palabra = "Bienvenido";

        function loopear(palabra) {
            for(let letra of palabra){
                document.write(letra + "<br>");
            }
        }
        loopear(palabra)
    </script>
</body>
</html>
