<!DOCTYPE html>
<html lang="en">
<head>
    <title>Practica Break y Continue 1</title>
</head>
<body>

    <script>
        let miArray = ['A', 'A', 'B', 'A', 'B', 'B', 'A'];

        function testLoop(miArray) {
            for (let letra of miArray) {
                if (letra === 'B') {
                    break;
                }
                console.log(letra);
            }
        }

        testLoop(miArray);
    </script>

</body>
</html>
