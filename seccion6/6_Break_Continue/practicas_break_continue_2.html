<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Break y Continue</title>
</head>
<body>

    <script>
        let miArray = [9, 5, 6, 2, 7];

        function testLoop(miArray) {
            for (let numero of miArray) {
                if (numero <= 5) {
                    continue;
                }
                console.log(numero);
            }
        }

        testLoop(miArray);
    </script>

</body>
</html>
