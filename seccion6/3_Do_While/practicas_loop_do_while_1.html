<!DOCTYPE html>
<html lang="en">
<head>
    <title>Practica Do While</title>
</head>
<body>
    <script>

        function testLoop(vueltas) {
            let limite = parseInt(vueltas);

            let contador =0;
            do {
                console.log("Vuelta numero: " + contador);
                contador++;
            } while (contador <= limite);
        }

    </script>
</body>
</html>
