<!DOCTYPE html>

<head>
    <title>Return 2</title>
</head>

<body>
    <p>
        <button onclick="mostrarFecha()">Click aqui</button>
    </p>
    <script>
        function mostrarFecha(){
            alert(obtenerFecha());
        }
        function obtenerFecha(){
            const Fecha= new Date().toLocaleDateString("es-ES");
            return Fecha;
            
        }
    </script>
</body>
</html>
