<!DOCTYPE html>
<head>
    <title>Random 1</title>
</head>

<body>
    <p>
        <button onclick="mostrarMensaje()">Dame un Aleatorio</button>
    </p>
    <script>
        function mostrarMensaje() {
        let Aleatorio = Math.floor(Math.random() * (51 - 10) + 10);
        alert(Aleatorio)
        }
    </script>
</body>
</html>
