<!DOCTYPE html>

<head>
    <title>Index</title>
</head>
<body>
    <script>
        function potenciar(base, exponente){
            return Math.pow(base, exponente)
        }

        function calcularCircunferencia(diametro){
            return Math.PI * diametro;
        }

        console.log("Potencia:" + potenciar(2,3))
        alert("Calcular circuferencia: " + calcularCircunferencia)
    </script>
</body>
